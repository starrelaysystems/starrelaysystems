<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lead Suite — Free trial sandbox</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
  :root{
    --bg:#121210; --surface:#1B1A16; --surface-2:#242219; --border:#34322A;
    --text:#EDE8DC; --muted:#9C9686; --gold:var(--accent-override, #C0964B); --gold-dark:#A67D3A;
    --hot:#C15A44; --hot-bg:#2A1712; --warm:#C79A42; --warm-bg:#2A2013;
    --cold:#6C8E9A; --cold-bg:#17252A; --won:#6B9A7B; --won-bg:#16241B;
    --creator:#9B7FD4; --creator-bg:#251E33;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',sans-serif; background:var(--bg); color:var(--text);}
  .serif{font-family:'Playfair Display',serif;}

  #auth-screen{position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:50;}
  .login-box{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:36px; width:100%; max-width:340px;}
  .login-box h1{font-size:24px; margin:0 0 4px; font-family:'Playfair Display',serif;}
  .login-box p.sub{font-size:12.5px; color:var(--muted); margin:0 0 24px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); margin-bottom:6px;}
  .field input, .field select{width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:10px 12px; border-radius:6px; font-size:13.5px; font-family:inherit;}
  .error{color:var(--hot); font-size:12.5px; margin:-6px 0 12px;}
  .login-box button{width:100%; background:var(--gold); color:#171510; border:none; padding:11px; border-radius:6px; font-weight:700; font-size:13.5px; cursor:pointer; margin-top:6px;}
  .switch-link{font-size:12px; color:var(--muted); margin-top:16px; text-align:center;}
  .switch-link a{color:var(--gold); cursor:pointer; text-decoration:underline;}

  .app{display:none;}
  .app.visible{display:flex; min-height:100vh;}
  .sidebar{width:250px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border); padding:26px 20px; display:flex; flex-direction:column; gap:20px;}
  .brand h1{font-size:20px; margin:0 0 3px; font-weight:700; font-family:'Playfair Display',serif;}
  .brand p{font-size:11px; color:var(--muted); margin:0; font-style:italic;}
  .user-card{background:var(--surface-2); border-radius:8px; padding:12px 14px; display:flex; align-items:center; gap:10px; cursor:pointer;}
  .avatar{width:32px; height:32px; border-radius:50%; background:var(--gold); color:#171510; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; overflow:hidden; flex-shrink:0;}
  .avatar img{width:100%; height:100%; object-fit:cover;}
  .user-card .name{font-size:13px; font-weight:600;}
  .role-badge{font-size:9.5px; text-transform:uppercase; letter-spacing:0.05em; padding:2px 7px; border-radius:9px; display:inline-block; margin-top:2px;}
  .role-badge.admin{background:var(--hot-bg); color:var(--hot);}
  .role-badge.mid{background:var(--warm-bg); color:var(--warm);}
  .role-badge.agent{background:var(--cold-bg); color:var(--cold);}
  .role-badge.creator{background:var(--creator-bg); color:var(--creator);}
  .tabs{display:flex; flex-direction:column; gap:3px;}
  .tab{text-align:left; padding:10px 12px; font-size:13px; font-weight:600; color:var(--muted); border-radius:6px; cursor:pointer; border:none; background:none;}
  .tab.active{background:var(--surface-2); color:var(--gold);}
  .sidebar-footer{margin-top:auto; display:flex; flex-direction:column; gap:10px;}
  .btn-icon{background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:9px 12px; border-radius:6px; font-size:12px; cursor:pointer;}
  .btn-primary{background:var(--gold); color:#171510; border:none; padding:9px 16px; border-radius:6px; font-size:12.5px; font-weight:600; cursor:pointer;}

  .main{flex:1; display:flex; flex-direction:column; min-width:0;}
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:22px 32px; border-bottom:1px solid var(--border); gap:16px; flex-wrap:wrap;}
  input.search{border:1px solid var(--border); background:var(--surface); padding:8px 12px; border-radius:6px; font-size:12.5px; width:180px; font-family:inherit; color:var(--text);}
  .view{display:none; padding:24px 32px;}
  .view.active{display:block;}

  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:1px; background:var(--border); margin-bottom:1px;}
  .stat{background:var(--surface); padding:16px 18px;}
  .stat .num{font-family:'Playfair Display',serif; font-size:26px; font-weight:700; color:var(--gold); line-height:1;}
  .stat .lbl{font-size:11px; color:var(--muted); margin-top:5px;}

  .board{display:grid; grid-template-columns:repeat(5, minmax(200px,1fr)); gap:1px; background:var(--border); margin-top:20px;}
  .column{background:var(--bg); padding:16px 12px; min-height:160px;}
  .column h3{font-size:11.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); font-weight:700; margin:2px 4px 12px; display:flex; justify-content:space-between;}
  .column h3 .count{color:var(--text);}
  .lead-card{background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:10px; cursor:grab;}
  .card-top{display:flex; align-items:center; gap:9px; margin-bottom:9px;}
  .card-top .name{font-weight:600; font-size:13.5px;}
  .card-top .contact{font-size:11px; color:var(--muted);}
  .card-bottom{display:flex; justify-content:space-between; align-items:center; gap:6px; flex-wrap:wrap;}
  .value{font-family:'Playfair Display',serif; font-weight:700; font-size:15px; color:var(--gold);}
  .assignee{font-size:10px; color:var(--muted);}
  .tag{font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:20px;}
  .tag.hot{background:var(--hot-bg); color:var(--hot);}
  .tag.warm{background:var(--warm-bg); color:var(--warm);}
  .tag.cold{background:var(--cold-bg); color:var(--cold);}
  .empty-col{font-size:11.5px; color:var(--muted); text-align:center; padding:20px 6px; border:1px dashed var(--border); border-radius:8px;}
  .column.dragover{background:var(--surface-2);}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th, td{text-align:left; padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:middle;}
  th{color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:0.04em;}
  .small-btn{background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:5px 9px; border-radius:5px; font-size:11px; cursor:pointer; margin-right:5px;}
  .small-btn.danger{color:var(--hot); border-color:var(--hot);}
  .role-select{padding:5px 8px; border-radius:5px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:11.5px;}
  .panel-box{background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:22px; margin-bottom:24px;}
  .panel-box h3{font-size:16px; margin:0 0 16px; font-family:'Playfair Display',serif;}
  .add-user-row{display:grid; grid-template-columns:1.5fr 1.5fr 1fr auto; gap:10px; align-items:end;}
  .locked-note{font-size:11px; color:var(--muted); margin:-8px 0 12px;}
  .profile-avatar-lg{width:80px; height:80px; border-radius:50%; background:var(--gold); color:#171510; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:26px; overflow:hidden; flex-shrink:0;}
  .profile-avatar-lg img{width:100%; height:100%; object-fit:cover;}
  .avatar-upload-btn{font-size:12px; color:var(--gold); cursor:pointer; text-decoration:underline; margin-top:6px; display:inline-block;}
  .my-leads-row{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:12.5px;}
  .section-label{font-size:11px; text-transform:uppercase; color:var(--muted); letter-spacing:0.06em; margin:16px 0 6px;}
  .perm-list{display:grid; grid-template-columns:1fr 1fr; gap:6px; font-size:12.5px;}
  .perm-list .yes{color:var(--won);} .perm-list .no{color:var(--hot);}
  .toggle-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px;}
  .toggle-row:last-child{border-bottom:none;}

  .overlay{display:none; position:fixed; inset:0; background:rgba(10,9,7,0.6); align-items:center; justify-content:center; padding:20px; z-index:20;}
  .overlay.open{display:flex;}
  .modal{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:26px; width:100%; max-width:420px; max-height:88vh; overflow-y:auto;}
  .modal h2{margin:0 0 18px; font-size:20px; font-family:'Playfair Display',serif;}
  .modal-actions{display:flex; gap:10px; margin-top:20px;}
  .modal-actions button{flex:1; padding:10px; border-radius:6px; font-size:14px; font-weight:600; cursor:pointer; border:none;}
  .btn-cancel{background:var(--surface-2); color:var(--text);}
  .btn-save{background:var(--gold); color:#171510;}
  .btn-danger{background:var(--hot); color:#fff;}
  .kv{margin-bottom:8px;} .kv .k{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em;} .kv .v{font-size:13px;}
  .user-detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;}

  @media (max-width:900px){ .app.visible{flex-direction:column;} .sidebar{width:100%;} .board{grid-template-columns:1fr;} .perm-list{grid-template-columns:1fr;} }

  .pw-wrap{position:relative;}
  .pw-wrap input{padding-right:54px;}
  .pw-toggle{position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; font-size:11px; font-weight:600; color:var(--muted); cursor:pointer; padding:5px 7px; z-index:2;}
  .pw-toggle:hover{color:var(--ink);}
  /* Suppress browsers' own built-in reveal-password icon so it can't overlap our custom Show/Hide button */
  input[type="password"]::-ms-reveal, input[type="password"]::-ms-clear{ display:none; }
  .login-box .brand-logo{display:block; height:34px; margin-bottom:14px;}

  #trial-banner{background:var(--ink); color:#fff; text-align:center; font-size:13px; font-weight:600; padding:9px 12px;}
  #trial-banner a{color:inherit;}
  .subscribe-btn{background:#C4622D; color:#fff; border:none; padding:8px 14px; border-radius:6px; font-size:12.5px; font-weight:700; cursor:pointer; text-decoration:none;}
  #expired-screen{display:none; position:fixed; inset:0; background:var(--paper); align-items:center; justify-content:center; padding:24px;}
  #expired-screen.visible{display:flex;}
  .expired-box{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:40px; max-width:420px; text-align:center;}
  .expired-box img{height:34px; margin-bottom:16px;}
  .expired-box h1{font-size:22px; margin:0 0 10px;}
  .expired-box p{color:var(--muted); font-size:14px; margin:0 0 22px;}
</style>
</head>
<body>

<div id="trial-banner"></div>

<div id="app">
  <header>
    <div class="brand" style="display:flex; align-items:center; gap:10px;">
      <img src="assets/logo.png" alt="Star Relay Systems" style="height:26px;">
      <div><h1>Lead Suite <span style="font-size:12px; font-weight:600; opacity:.7;">(sandbox)</span></h1><p>Every deal, tracked and assigned.</p></div>
    </div>
    <div class="header-right">
      <input class="search" id="search-input" type="text" placeholder="Search leads...">
      <button class="btn-primary" id="add-lead-btn">+ Add lead</button>
      <a class="subscribe-btn" id="signup-cta-1" href="#">Subscribe now</a>
    </div>
  </header>
  <main>
    <div class="stats" id="stats"></div>
    <div class="board" id="board"></div>
  </main>
</div>

<div class="overlay" id="lead-modal">
  <div class="modal">
    <h2>New lead</h2>
    <div class="field"><label>Name</label><input id="lead-name" type="text"></div>
    <div class="field"><label>Contact</label><input id="lead-contact" type="text"></div>
    <div class="field"><label>Estimated value (R)</label><input id="lead-value" type="number"></div>
    <div class="field"><label>Temperature</label><select id="lead-temp"><option value="hot">Hot</option><option value="warm" selected>Warm</option><option value="cold">Cold</option></select></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="lead-cancel-btn">Cancel</button>
      <button class="btn-save" id="lead-save-btn">Save lead</button>
    </div>
  </div>
</div>

<div id="expired-screen">
  <div class="expired-box">
    <img src="assets/logo.png" alt="Star Relay Systems">
    <h1>Your 14-day trial has ended</h1>
    <p>Subscribe to keep your board, invite your team, and get real accounts for everyone.</p>
    <a class="subscribe-btn" id="signup-cta-2" href="#" style="display:inline-block; padding:12px 20px; font-size:14px;">Subscribe to Lead Suite →</a>
  </div>
</div>

</script>
<script src="sandbox-core.js"></script>
</body>
</html>
